<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News — ON.IT</title>
  <meta name="description" content="Le ultime novità e gli aggiornamenti del sito ON.IT.">
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="ON.IT — Siti web su misura">
  <meta property="og:description" content="Realizziamo siti web professionali per la tua attività.">
  <meta property="og:image" content="assets/img/favicon.png">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>document.documentElement.classList.add("js");</script>
</head>
<body data-page="news">
  <a class="skip-link" href="#main">Vai al contenuto</a>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">Bacheca aggiornamenti</span>
        <h1 class="display">
          <span class="line"><span>News</span></span>
        </h1>
        <div class="hero-bottom">
          <p class="lead">Tutte le modifiche e le novità recenti del sito ON.IT, in ordine cronologico: nuove sezioni, aggiornamenti e miglioramenti.</p>
          <p class="lead" style="max-width:none"><strong id="newsCount" style="color:#fff"></strong> aggiornamenti · ultimo il <strong id="newsLast" style="color:#fff"></strong></p>
        </div>
      </div>
    </section>

    <section class="section" style="padding-top:64px">
      <div class="container">
        <div class="board-toolbar reveal" id="newsFilters" role="group" aria-label="Filtra per categoria"></div>
        <div class="timeline" id="newsBoard" aria-live="polite"></div>
      </div>
    </section>

    <section class="section section--light cta-band">
      <div class="container reveal">
        <span class="eyebrow">Hai un progetto?</span>
        <h2 class="display">Il prossimo<br>sito è il tuo.</h2>
        <div class="hero-actions">
          <a class="btn" href="index.html?tipo=incontro#prenota">Prenota un incontro <span class="arrow">→</span></a>
          <a class="btn btn--ghost" href="index.html#piani">Scopri i piani</a>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
